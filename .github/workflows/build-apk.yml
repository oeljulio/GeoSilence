name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/GeoSilence-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: GeoSilence-Debug-APK
          path: build-output/GeoSilence-debug.apk
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download APK Artifact
        uses: actions/download-artifact@v5
        with:
          name: GeoSilence-Debug-APK
          path: build-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/GeoSilence-debug.apk
          name: "GeoSilence ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
